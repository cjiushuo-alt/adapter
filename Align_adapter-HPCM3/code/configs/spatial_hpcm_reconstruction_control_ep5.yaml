# Spatial task-0 A/B control paired to the historical Spatial HPCM3 C result.
model:
  model_family: openvla
  pretrained_checkpoint: /home/cjs/study/VLA/VLA-Adapter/outputs/LIBERO-Spatial-Pro
  use_hpcm_adapter: false
  preserve_checkpoint_files: true
  use_l1_regression: true
  use_minivlm: true
  num_diffusion_steps: 50
  use_film: false
  num_images_in_input: 2
  use_proprio: true
  center_crop: true
  hpcm_raw_input_bypass: false
  num_open_loop_steps: 8
  unnorm_key: libero_spatial_no_noops
  load_in_8bit: false
  load_in_4bit: false
  save_version: spatial-hpcm-reconstruction-control-ep5
  use_pro_version: true
  hpcm:
    hpcm_root: /home/cjs/study/VLA/VLA-Adapter/HPCM
    checkpoint: /home/cjs/study/VLA/VLA-Adapter/HPCM/ckpt/0.0018.pth.tar
    model_name: HPCM_Base
    scale_table_levels: 60
  adapter:
    checkpoint: /home/cjs/study/VLA/VLA-Adapter/Align_adapter-HPCM3/ckpt/last-v1.pt
  vision_backbone:
    max_layer: 2
  vla_path: /home/cjs/study/VLA/VLA-Adapter/outputs/LIBERO-Spatial-Pro
  vla_id: prismatic
  processor_name: null
libero:
  task_suite_name: libero_spatial
  num_steps_wait: 10
  num_trials_per_task: 5
  initial_states_path: DEFAULT
  env_img_res: 256
logging:
  local_log_dir: results/hpcm3_spatial_compression_control/task0_ep5
  use_wandb: false
  save_rollout_videos: false
seed: 7
experiment:
  episodes: 5
  adapter_results: results/spatial_hpcm3_repro_smoke/episode_results.jsonl
  adapter_audit: results/hpcm3_libero4/spatial/audit.jsonl
