# Frozen Spatial-Pro + HPCM3, Object non-vision policy evaluation.
model:
  model_family: "openvla"
  pretrained_checkpoint: "/media/cjs/shared/linux/VLA-Adapter/shared_vision_policy_ckpts/runs/shared-spatialpro-hpcm3-object-nonvision-r64-b2-ga8-seed7-20260917-2000--200000_chkpt"
  use_l1_regression: true
  use_minivlm: true
  num_diffusion_steps: 50
  use_film: false
  num_images_in_input: 2
  use_proprio: true
  center_crop: true
  num_open_loop_steps: 8
  unnorm_key: "libero_object_no_noops"
  load_in_8bit: false
  load_in_4bit: false
  save_version: "hpcm3-object-retrained-nonvision"
  use_pro_version: true
  hpcm:
    hpcm_root: "/home/cjs/study/VLA/VLA-Adapter/HPCM"
    checkpoint: "/home/cjs/study/VLA/VLA-Adapter/HPCM/ckpt/0.0018.pth.tar"
    model_name: "HPCM_Base"
    scale_table_levels: 60
  adapter:
    checkpoint: "/home/cjs/study/VLA/VLA-Adapter/Align_adapter-HPCM3/ckpt/last-v1.pt"
    hpcm_input_dim: 320
    pre_neck_output_dim: 320
    pre_neck_spatial_size: 16
    pre_neck_num_res_blocks: 2
    pre_neck_dropout: 0.0
    siglip_dim: 1152
    dino_dim: 1024
    neck_num_heads: 8
    neck_ffn_hidden_dim: null
    neck_dropout: 0.0
    neck_activation: "gelu"
  vision_backbone:
    max_layer: 2
  vla_path: "/media/cjs/shared/linux/VLA-Adapter/shared_vision_policy_ckpts/runs/shared-spatialpro-hpcm3-object-nonvision-r64-b2-ga8-seed7-20260917-2000--200000_chkpt"
  vla_id: "prismatic"
  processor_name: null

libero:
  task_suite_name: "libero_object"
  num_steps_wait: 10
  num_trials_per_task: 50
  initial_states_path: "DEFAULT"
  env_img_res: 256

logging:
  run_id_note: "hpcm3-object-retrained-object-eval"
  local_log_dir: "/home/cjs/study/VLA/VLA-Adapter/results/hpcm3_object_retrain_eval/object"
  use_wandb: false
  wandb_entity: "your-wandb-entity"
  wandb_project: "your-wandb-project"
  episode_results_jsonl: "/home/cjs/study/VLA/VLA-Adapter/results/hpcm3_object_retrain_eval/object/episode_results.jsonl"
  summary_json: "/home/cjs/study/VLA/VLA-Adapter/results/hpcm3_object_retrain_eval/object/summary.json"
  save_rollout_videos: false

audit:
  enabled: true
  output_jsonl: "/home/cjs/study/VLA/VLA-Adapter/results/hpcm3_object_retrain_eval/object/audit.jsonl"
  compare_train_frames: true
  train_dataset_dir: "/home/cjs/study/VLA/VLA-Adapter/Align_adapter/dataset"
  train_ratio: 0.9
  split_seed: 42
  train_hash_cache: "/home/cjs/study/VLA/VLA-Adapter/training_state/hpcm3_train_rgb_sha256_seed42_ratio0.9.txt"

guard:
  # Stop for human review if the first two complete tasks are both largely
  # unsuccessful. This avoids wasting the full 500-episode budget on a broken
  # policy while not overreacting to one unusually difficult task.
  enabled: true
  min_episodes: 100
  min_success_rate: 0.1

seed: 7
phase: "Inference"
startup_check_only: false
